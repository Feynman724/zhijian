<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="织见引导演示：把群聊、线上会议和文件编织到同一条决策时间线。" />
    <title>织见 · 团队内部演示</title>
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <header class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span><strong>织见</strong><small>讨论产生可用结果</small></span></header>
        <section class="scenario-card"><small id="scenario-label">INTERNAL DEMO</small><strong id="scenario-title">产品方向讨论</strong><p id="scenario-question">第一版先做网页还是小程序？</p></section>
        <nav class="stage-nav" aria-label="演示章节">
          <button type="button" data-stage="0"><span>01</span><strong>跨场景收集</strong><small>群聊进入会议再回到群聊</small></button>
          <button type="button" data-stage="1"><span>02</span><strong>人工智能参与</strong><small>读取完整上下文并确认决策</small></button>
          <button type="button" data-stage="2"><span>03</span><strong>三天后</strong><small>回看依据并触发复核</small></button>
        </nav>
        <div class="speaker-note"><small>演示提示</small><p id="speaker-note">点击“开始演示”，或使用 ← → 控制节奏。</p></div>
        <footer><span class="avatar">孙</span><span><strong>孙宇杰</strong><small>演示者</small></span></footer>
      </aside>

      <main class="discussion-panel">
        <header class="topbar">
          <div><small>DISCUSSION SPACE</small><strong id="discussion-title">产品方向讨论</strong><span id="time-label">今天 09:02</span></div>
          <div class="top-actions"><span class="live-status"><i></i> 跨场景整理已开启</span><button id="export-context" type="button" title="导出当前已展示的完整讨论上下文">导出上下文</button><button id="demo-mode" type="button">演示模式</button></div>
        </header>
        <section class="stage-strip"><div id="stage-progress"></div><span id="stage-eyebrow">第一段 · 跨场景收集</span><strong id="stage-title">群聊发起，会议展开，内容回到同一条时间线</strong></section>
        <div class="feed" id="feed" aria-live="polite"></div>
        <section class="composer"><div class="fake-input">发送消息，或 <strong>@织见机器人</strong> 邀请 AI 参与</div><button type="button">@ 织见机器人</button><button type="button" class="voice">● 语音讨论</button></section>
      </main>

      <aside class="output-panel">
        <header><div><small>LIVE SYNTHESIS</small><strong>跨场景实时整理</strong></div><span id="analysis-state"><i></i>等待讨论</span></header>
        <div class="output-content" id="output-content"></div>
      </aside>
    </div>

    <section class="demo-controls" aria-label="演示控制">
      <button id="prev-step" type="button" aria-label="上一步">←</button>
      <button id="play-demo" type="button" class="play">开始演示</button>
      <button id="next-step" type="button" aria-label="下一步">→</button>
      <div class="progress"><span id="step-label">0 / 14</span><div><i id="step-progress"></i></div></div>
      <button id="restart-demo" type="button">重新开始</button>
    </section>

    <dialog class="export-dialog" id="export-dialog" aria-labelledby="export-title">
      <div class="export-dialog-head"><div><small>OPEN CONTEXT</small><h2 id="export-title">带走这场讨论</h2></div><button type="button" id="close-export" aria-label="关闭导出预览">×</button></div>
      <p>按发生顺序保留群聊、会议原话、共享文件和 AI 建议；决策会附上依据与复核条件。</p>
      <div class="export-preview-head"><strong>Markdown 预览</strong><span id="export-count">0 条记录</span></div>
      <pre id="export-preview"></pre>
      <div class="export-actions"><button type="button" id="download-json">下载 JSON · 供程序处理</button><button type="button" id="download-markdown">下载 Markdown · 可直接阅读 / 发给 AI</button></div>
    </dialog>

    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>
